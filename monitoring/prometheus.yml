global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "frontend"
    static_configs:
      - targets: ["frontend-service:8000"]

  - job_name: "checkout"
    static_configs:
      - targets: ["checkout-service:8001"]

  - job_name: "payment"
    static_configs:
      - targets: ["payment-service:8002"]
