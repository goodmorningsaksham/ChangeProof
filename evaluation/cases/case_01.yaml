# CASE-01: Canonical Retry Amplification Scenario
id: "case-01"
version: "1.0"
title: "Downstream Latency Induces Retry Amplification Storm"
description: "Checkout increases RETRIES_MAX from 3 to 8 under 2000ms payment latency."

target:
  compose_file: "docker-compose.yml"
  git_commit: "main"

fault:
  tool: "toxiproxy"
  proxy: "payment-proxy"
  admin_url: "http://localhost:8474"
  toxic:
    type: "latency"
    attributes:
      latency: 2000
      jitter: 100

workload:
  tool: "k6"
  script: "workloads/checkout_load.js"
  duration: "45s"
  vus: 10
  rps_target: 30

measurements:
  prometheus_url: "http://localhost:9090"
  scrape_interval_s: 1
  metrics:
    - name: "retry_count_total"
      labels: { service: "checkout", target: "payment" }
    - name: "http_errors_total"
      labels: { service: "checkout" }
    - name: "checkout_requests_total"
      labels: { service: "checkout" }

assertions:
  pre_patch:
    - metric: "retry_count_total"
      condition: "rate_per_min > 500"
      description: "Retry amplification storm visible under downstream latency (empirically >3000/min in broken state)"
  post_patch:
    - metric: "retry_count_total"
      condition: "rate_per_min < 150"
      description: "Retry count bounded and controlled after remediation with exponential backoff (empirically <100/min)"
