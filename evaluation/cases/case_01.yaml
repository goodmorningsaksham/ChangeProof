# CASE-01: Canonical Retry Amplification Scenario
id: "case-01"
version: "1.1"
title: "Downstream Latency Induces Retry Amplification Storm"
description: "Checkout increases RETRIES_MAX from 3 to 8 under 2000ms payment latency."

target:
  compose_file: "docker-compose.yml"
  git_commit: "main"

fault:
  tool: "toxiproxy"
  proxy: "payment-proxy"
  admin_url: "http://localhost:8474"
  toxic:
    type: "latency"
    attributes:
      latency: 2000
      jitter: 100

workload:
  tool: "k6"
  script: "workloads/checkout_load.js"
  duration: "45s"
  vus: 10
  rps_target: 30

measurements:
  prometheus_url: "http://localhost:9090"
  scrape_interval_s: 1
  metrics:
    - name: "retry_count_total"
      labels: { service: "checkout", target: "payment" }
    - name: "http_errors_total"
      labels: { service: "checkout" }
    - name: "checkout_requests_total"
      labels: { service: "checkout" }

assertions:
  pre_patch:
    - metric: "retries_per_request"
      condition: "> 2.0"
      description: "Retry amplification storm visible as >2.0 retries per failed request (observed 7.0 in CI base state (RETRY_TIMEOUT=0.5); 4.531 with TIMEOUT=1.0 local run)"
    - metric: "total_requests"
      condition: ">= 100"
      description: "Sufficient workload request sample size under failure (observed 150 in CI base state; 390 in local run (TIMEOUT=1.0))"
  post_patch:
    - metric: "retries_per_request"
      condition: "<= 1.1"
      description: "Retry count bounded to <=1.1 retries per failed request after backoff remediation (observed 1.0 in patched state)"
    - metric: "total_requests"
      condition: ">= 100"
      description: "Sufficient workload request sample size under failure (observed 150 in CI patched state; 723 in local run (TIMEOUT=1.0))"
