id: case-ablation-backoff-01
version: '1.1'
title: 'Topology-Synthesized: Downstream Latency Induces Retry Amplification (checkout
  -> payment)'
description: 'Automated synthesis: checkout-service calls payment-service over payment-proxy.
  Injected latency (2000ms) calibrated against client timeout to reproduce retry storm.'
target:
  compose_file: docker-compose.yml
  git_commit: main
  changed_service: checkout-service
  changed_file: app/checkout/main.py
fault:
  tool: toxiproxy
  proxy: payment-proxy
  admin_url: http://localhost:8474
  toxic:
    type: latency
    attributes:
      latency: 2000
      jitter: 100
workload:
  target_service: frontend-service
  entrypoint_route: /orders
  entrypoint_payload:
    item_id: item_123
    quantity: 1
  tool: k6
  script: workloads/checkout_load.js
  duration: 15s
  vus: 10
  rps_target: 10
  num_requests: 150
measurements:
  prometheus_url: http://localhost:9090
  scrape_interval_s: 1
  metrics:
  - name: retry_count_total
    labels:
      service: checkout
      target: payment
  - name: http_errors_total
    labels:
      service: checkout
  - name: checkout_requests_total
    labels:
      service: checkout
assertions:
  pre_patch:
  - metric: retries_per_request
    condition: '> 2.0'
    description: Retry amplification storm visible as >2.0 retries per failed request
  - metric: total_requests
    condition: '>= 100'
    description: Sufficient workload request sample size under failure
  post_patch:
  - metric: retries_per_request
    condition: <= 1.1
    description: Retry count bounded to <=1.1 retries per failed request after remediation
  - metric: total_requests
    condition: '>= 100'
    description: Sufficient workload request sample size under failure
