# CASE-10: UNSEALED HOLDOUT CASE (Formal Generalization Evaluation)
id: "case-10"
version: "1.1"
status: "ACTIVE"
title: "Compound Failure: High Latency and Concurrency Wave Induce Retry Cascade"
description: "Blind generalization holdout test combining 3500ms downstream latency, concurrent load spike, and un-jittered retries."

target:
  compose_file: "docker-compose.yml"
  git_commit: "main"

fault:
  tool: "toxiproxy"
  proxy: "payment-proxy"
  admin_url: "http://localhost:8474"
  toxic:
    type: "latency"
    attributes:
      latency: 3500
      jitter: 150

workload:
  tool: "k6"
  script: "workloads/checkout_load.js"
  duration: "45s"
  vus: 15
  rps_target: 45

measurements:
  prometheus_url: "http://localhost:9090"
  scrape_interval_s: 1
  metrics:
    - name: "retry_count_total"
      labels: { service: "checkout", target: "payment" }
    - name: "http_errors_total"
      labels: { service: "checkout" }
    - name: "checkout_requests_total"
      labels: { service: "checkout" }

assertions:
  pre_patch:
    - metric: "retries_per_request"
      condition: "> 2.0"
      description: "Severe compound retry cascade visible under latency and concurrency wave"
    - metric: "total_requests"
      condition: ">= 100"
      description: "Sufficient workload request sample size under compound fault"
  post_patch:
    - metric: "retries_per_request"
      condition: "<= 1.1"
      description: "Retry budget and exponential backoff prevent downstream cascade"
    - metric: "total_requests"
      condition: ">= 100"
      description: "Sufficient workload request sample size under compound fault"
