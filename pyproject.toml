[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "changeproof"
version = "0.1.0"
description = "Deterministic Reliability Verification Pipeline for PR Microservice Diffs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
    "httpx==0.27.0",
    "requests==2.31.0",
    "tenacity==8.2.3",
    "prometheus-client==0.20.0",
    "pydantic==2.6.4",
    "pytest==8.1.1",
    "pyyaml==6.0.1",
    "jinja2==3.1.3",
    "pandas==2.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["changeproof*"]
