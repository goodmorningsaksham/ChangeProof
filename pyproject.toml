[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "changeproof"
version = "0.1.0"
description = "Deterministic Reliability Verification Pipeline for PR Microservice Diffs"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["changeproof*"]
